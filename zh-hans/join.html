  <body class="bg-sky font-sans text-ink">
    <main class="mx-auto max-w-md px-6 py-12 text-center">
      <div class="flex items-center justify-between gap-3">
        <a href="./" class="text-sm underline">回到 Huggybugi 首页</a>
        <details class="langs"><summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg><span>简体中文</span></summary><nav class="langmenu"><a href="/join.html">한국어</a><a href="/en/join.html">English</a><a href="/ja/join.html">日本語</a><a href="/zh-hans/join.html" aria-current="page">简体中文<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></a><a href="/zh-hant/join.html">繁體中文</a><a href="/es/join.html">Español</a><a href="/pt/join.html">Português (Brasil)</a></nav></details>
      </div>
      <img
        src="../assets/guide/ddeoggi-happy-strip.png"
        alt="Huggybugi"
        class="mx-auto mt-8 size-24 object-cover object-left [image-rendering:pixelated]"
      />
      <h1
        id="title"
        class="mt-4 font-pixel text-4xl leading-tight"
        data-named="你被邀请加入 {name}"
      >
        你被邀请加入群组
      </h1>
      <p class="mt-3 text-sm">在桌面上和朋友的角色一起玩的应用。</p>
      <div class="mt-6 grid gap-3">
        <a
          id="open"
          href="./"
          class="block rounded-2xl border-2 border-ink bg-white px-4 py-3 font-bold"
          >打开应用</a
        >
        <a
          id="download"
          href="./"
          class="block rounded-2xl border-2 border-ink px-4 py-3 font-bold"
          >下载应用</a
        >
        <div id="others" class="flex justify-center gap-4 text-sm">
          <a href="./" data-os="mac-arm64" class="underline">Mac (Apple)</a>
          <a href="./" data-os="mac-x64" class="underline">Mac (Intel)</a>
          <a href="./" data-os="win" class="underline">Windows</a>
        </div>
      </div>
      <p id="phone" hidden class="mt-6 rounded-2xl border-2 border-ink bg-white p-4 text-sm">
        Huggybugi 是电脑应用,请在电脑上打开此链接。
      </p>
      <p id="bad" hidden class="mt-6 rounded-2xl border-2 border-ink bg-white p-4 text-sm">
        邀请链接已更改或不存在,请向朋友索取新链接。
      </p>
      <p id="after" class="mt-6 rounded-2xl border-2 border-ink bg-white p-4 text-sm">
        安装后,请在此页面再次点击打开应用,或输入邀请码 <b id="code" class="font-mono"></b>。
      </p>
    </main>
    <script type="module" src="../join.js"></script>
  </body>
